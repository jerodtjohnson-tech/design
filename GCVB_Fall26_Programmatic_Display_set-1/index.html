  height: 25px;
  width: 120px;
  border: none;
  background: #9b9b9b;
  border-radius: 20px;
  cursor: pointer;
  margin: 5px auto;
}

.lable {
  line-height: 20px;
  font-size: 12px;
  color: #ffffff;
  letter-spacing: 1px;
}

.button:hover {
  background: #494949;
}

.button:hover .svg-icon {
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }

  100% {
    transform: rotate(-360deg);
  }
}
